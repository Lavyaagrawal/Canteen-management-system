<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTE&BITE - Seller Administration</title>
    <link rel="stylesheet" href="../assets/css/home.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0e0 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', 'Montserrat', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
        }
        .auth-box {
            background: rgba(255,255,255,0.98);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            max-width: 400px;
            width: 100%;
            margin: 2rem;
            padding: 2.5rem 2rem 2rem 2rem;
            position: relative;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header .logo-link {
            text-decoration: none;
        }
        .auth-header .logo-text {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #181818;
        }
        .auth-header .logo-orange {
            color: #ff6600;
        }
        .auth-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0.5rem 0 0.2rem 0;
        }
        .auth-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .auth-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .tab-btn {
            background: #fff;
            color: #ff6600;
            border: 1.5px solid #ff6600;
            border-radius: 8px 8px 0 0;
            padding: 0.7rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .tab-btn.active {
            background: #ff6600;
            color: #fff;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-label {
            color: #181818;
            font-weight: 600;
        }
        .form-input {
            padding: 1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1rem;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: #ff6600;
            outline: none;
            box-shadow: 0 2px 8px rgba(255, 102, 0, 0.08);
        }
        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, #ff6600 85%, #ffae42 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.2);
        }
        .error-message {
            color: #ff3333;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
        .password-input {
            position: relative;
        }
        .password-input input {
            padding-right: 3rem;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="mitadt-corner">
        <img src="../assets/images/LOGO2.png" alt="MIT ADT University Logo" class="mitadt-logo">
    </div>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <a href="../index.html" class="logo-link">
                    <span class="logo-text"><span class="logo-black">BYTE</span><span class="logo-orange">&</span><span class="logo-black">BITE</span></span>
                </a>
                <h2>Seller Administration</h2>
                <p>Login or sign up to manage your canteen</p>
            </div>
            <div class="auth-tabs">
                <button class="tab-btn active" id="login-tab">Login</button>
                <button class="tab-btn" id="register-tab">Sign Up</button>
            </div>
            <!-- Login Tab -->
            <div class="tab-content" id="login-content">
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-input" id="login-phone" placeholder="Enter your phone number" required pattern="[0-9]{10}">
                        <div class="error-message" id="login-phone-error">Please enter a valid 10-digit phone number</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-input">
                            <input type="password" class="form-input" id="login-password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="login-password-error">Invalid credentials</div>
                    </div>
                    <button type="submit" class="auth-btn">Login</button>
                </form>
            </div>
            <!-- Register Tab -->
            <div class="tab-content" id="register-content" style="display: none;">
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="register-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-input" id="register-phone" placeholder="Enter your phone number" required pattern="[0-9]{10}">
                        <div class="error-message" id="register-phone-error">Please enter a valid 10-digit phone number</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-input">
                            <input type="password" class="form-input" id="register-password" placeholder="Create a password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('register-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="password-input">
                            <input type="password" class="form-input" id="register-confirm-password" placeholder="Confirm your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('register-confirm-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = 'https://canteen-management-system-production-bfe6.up.railway.app';

        // Tab switching logic
        document.getElementById('login-tab').onclick = function() {
            this.classList.add('active');
            document.getElementById('register-tab').classList.remove('active');
            document.getElementById('login-content').style.display = '';
            document.getElementById('register-content').style.display = 'none';
        };
        document.getElementById('register-tab').onclick = function() {
            this.classList.add('active');
            document.getElementById('login-tab').classList.remove('active');
            document.getElementById('login-content').style.display = 'none';
            document.getElementById('register-content').style.display = '';
        };

        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE}/api/sellers/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone: `+91${phone}`,
                        password
                    })
                });

                let data;
                try {
                    const text = await response.text();
                    data = text ? JSON.parse(text) : {};
                } catch (e) {
                    data = { detail: 'Invalid response from server' };
                }

                if (response.ok) {
                    localStorage.setItem('seller_access', data.access || 'token');
                    localStorage.setItem('seller_refresh', data.refresh || 'refresh_token');
                    localStorage.setItem('seller', JSON.stringify({
                        phone: phone,
                        user_type: 'seller'
                    }));
                    window.location.href = 'home.html';
                } else {
                    document.getElementById('login-password-error').textContent = data.detail || 'Invalid phone number or password';
                    document.getElementById('login-password-error').style.display = 'block';
                }
            } catch (error) {
                console.error('Login Error:', error);
                document.getElementById('login-password-error').textContent = 'An error occurred. Please try again.';
                document.getElementById('login-password-error').style.display = 'block';
            }
        });

        // Register form handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('register-name').value;
            const phone = document.getElementById('register-phone').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/sellers/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        fullname,
                        phone: `+91${phone}`,
                        password
                    })
                });

                let data;
                try {
                    const text = await response.text();
                    data = text ? JSON.parse(text) : {};
                } catch (e) {
                    data = { detail: 'Invalid response from server' };
                }

                if (response.ok) {
                    localStorage.setItem('seller_access', data.access || 'token');
                    localStorage.setItem('seller_refresh', data.refresh || 'refresh_token');
                    localStorage.setItem('seller', JSON.stringify({
                        fullname: fullname,
                        phone: phone,
                        user_type: 'seller'
                    }));
                    alert('Account created successfully!');
                    window.location.href = 'home.html';
                } else {
                    alert(data.detail || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Registration Error:', error);
                alert('An error occurred. Please try again.');
            }
        });

        // Toggle password visibility
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            button.querySelector('i').classList.toggle('fa-eye');
            button.querySelector('i').classList.toggle('fa-eye-slash');
        }
    </script>
</body>
</html>
